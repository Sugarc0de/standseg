name: Release

# Most people who would use this do not have a Rust toolchain and are not going
# to install one to try a segmenter -- and installing one is not even enough,
# because `tiff`'s zstd feature pulls in `zstd-sys`, so a from-source build also
# needs a C compiler. On Windows that means the MSVC build tools, which is where
# a GIS user gives up. Tagging v* builds the binary for them instead.
#
# Linux and Windows only. macOS is built by scripts/release-macos.sh instead,
# on a Mac that holds the Developer ID certificate: an unsigned macOS binary is
# refused by Gatekeeper, and signing in CI would mean putting the certificate in
# GitHub Secrets. That script produces a signed, notarized universal binary to
# upload alongside these two.
#
# workflow_dispatch runs the whole build without publishing anything, so the
# packaging can be exercised before a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, not gnu: a gnu build on ubuntu-latest links glibc 2.39 and
          # will not start on older RHEL/CentOS or most HPC login nodes. musl
          # links statically, so the binary runs on anything x86_64.
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, ext: "",     archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    ext: ".exe", archive: zip }
    steps:
      - uses: actions/checkout@v5

      # A tag and the crate version have to agree, and not merely for tidiness:
      # CARGO_PKG_VERSION is written into every map this program produces, as
      # the ENVI `software` key and the TIFF `Software` tag. A binary released
      # as v0.2.1 that stamps its output "standseg 0.2.0" gives the user wrong
      # provenance for their results, which for this program is the one kind of
      # bug that matters most. v0.2.1 shipped exactly that way; this is why.
      - name: Tag and crate version must agree
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME is version $tag, Cargo.toml says $crate -- bump Cargo.toml and re-tag"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches Cargo.toml $crate"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # zstd-sys compiles C, so the musl target needs a musl C compiler; without
      # this the build fails in the zstd-sys build script, not in our code.
      - name: Install the musl C toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # `debug = 1` in the release profile is there for profiling and useful
      # backtraces; a download does not need it. Stripping is a link-time symbol
      # removal, so it cannot change what the code computes.
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols

      # Check the artifact people will actually download, not just that it
      # linked. This is the README's quick start, compared against the 1992 C's
      # own output, which ships in the repo. Output goes to RUNNER_TEMP because
      # nothing is ever written into tests/.
      - name: Segment the reference scene with the built binary
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/standseg${{ matrix.ext }}
          "$bin" --version
          "$bin" -t 10 -m .1 -n 15,15,100,2500,2500 \
              -o demo --outdir "$RUNNER_TEMP/out" tests/golden/misc/temp_byte_bip
          cmp "$RUNNER_TEMP/out/demo.rmap.51" \
              tests/golden/test_3456/expected/proof/regmap.rmap.51
          cmp "$RUNNER_TEMP/out/demo.armap.58" \
              tests/golden/test_3456/expected/proof/regmap.armap.58
          echo "region maps are byte-identical to the reference output"

      # MIT asks that the notice travel with the binary, so LICENSE goes in the
      # archive alongside it. Windows gets a .zip because Explorer cannot open a
      # .tar.gz by double-clicking, and this whole workflow exists for people
      # who are not going to reach for a command line to unpack it.
      - name: Package
        shell: bash
        run: |
          d=standseg-${{ matrix.target }}
          mkdir "$d"
          cp target/${{ matrix.target }}/release/standseg${{ matrix.ext }} "$d/"
          cp LICENSE README.md "$d/"
          # The README's first command needs something to segment, and its byte
          # comparison needs the 1992 C's output to compare against. Neither is
          # in a download unless it is put there, so the quick start failed for
          # exactly the people this workflow exists for -- anyone who took a
          # binary instead of cloning. 500 KB, and it makes the document true.
          mkdir "$d/sample"
          cp tests/golden/misc/temp_byte_bip \
             tests/golden/misc/temp_byte_bip.hdr \
             tests/golden/test_3456/expected/proof/regmap.rmap.51 \
             tests/golden/test_3456/expected/proof/regmap.armap.58 "$d/sample/"
          # The fixtures are read-only in the repo. Carrying that into a zip
          # leaves a Windows user with files Explorer will not let them delete.
          chmod u+w "$d"/sample/*
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$d.zip" "$d"
          else
            tar czf "$d.tar.gz" "$d"
          fi

      # Prove the archive stands on its own. The README tells someone who
      # downloaded a binary to unpack it and segment `sample/temp_byte_bip`; if
      # that file is not in the archive the instruction is simply false, and no
      # other check here would notice, because every one of them runs inside a
      # checkout where the fixture exists. So unpack the built archive into an
      # empty directory and run the README's own command with nothing else on
      # hand -- the repository cannot quietly supply a file that shipping
      # forgot.
      - name: Run the README quick start against the archive alone
        shell: bash
        run: |
          d=standseg-${{ matrix.target }}
          work="$RUNNER_TEMP/as-downloaded"
          mkdir -p "$work"
          cp "$d.${{ matrix.archive }}" "$work/"
          cd "$work"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z x -y "$d.zip" >/dev/null
          else
            tar xzf "$d.tar.gz"
          fi
          cd "$d"
          ./standseg${{ matrix.ext }} -t 10 -m .1 -n 15,15,100,2500,2500 \
              -o demo --outdir out sample/temp_byte_bip
          cmp out/demo.rmap.51  sample/regmap.rmap.51
          cmp out/demo.armap.58 sample/regmap.armap.58
          # The other command the README opens with, which needs georeferencing
          # from the .hdr to write a GeoPackage in the scene's own CRS.
          ./standseg${{ matrix.ext }} -t 20 -m .2 -n 50,100,200 --format gpkg \
              -o stands --outdir out sample/temp_byte_bip
          ls -l out/stands.armap.*.gpkg
          echo "the archive alone reproduces the 1992 output"

      - uses: actions/upload-artifact@v4
        with:
          name: standseg-${{ matrix.target }}
          path: standseg-${{ matrix.target }}.${{ matrix.archive }}

  release:
    needs: build
    # Tags only. A workflow_dispatch run builds and smoke-tests but publishes
    # nothing, so there is no way to create a release by accident.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
          generate_release_notes: true
