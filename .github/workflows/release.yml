name: Release

# Most people who would use this do not have a Rust toolchain and are not going
# to install one to try a segmenter. Tagging v* builds a binary for each
# platform and attaches it to the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  ext: "" }
          - { os: macos-latest,   target: aarch64-apple-darwin,      ext: "" }
          - { os: macos-13,       target: x86_64-apple-darwin,       ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    ext: ".exe" }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      # MIT asks that the notice travel with the binary, so LICENSE goes in
      # the tarball alongside it.
      - name: Package
        shell: bash
        run: |
          d=fast_segment-${{ matrix.target }}
          mkdir "$d"
          cp target/${{ matrix.target }}/release/fast_segment${{ matrix.ext }} "$d/"
          cp LICENSE README.md "$d/"
          tar czf "$d.tar.gz" "$d"

      - uses: actions/upload-artifact@v4
        with:
          name: fast_segment-${{ matrix.target }}
          path: fast_segment-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true
