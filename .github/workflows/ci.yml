name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Git does not preserve the read-only bits the fixtures are stored with,
      # and the checksums are the real guard anyway. Verify first, so a damaged
      # checkout reports itself as a fixture problem rather than as a couple of
      # dozen confusing test failures.
      - name: Verify the golden fixtures
        if: runner.os != 'Windows'
        shell: bash
        run: cd tests/golden && shasum -a 256 -c ../GOLDEN.sha256

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

  # Advisory only. The codebase predates any formatter and carries some
  # deliberate clippy offences -- `out[0 * 9 + 0]` is `row * width + col`, which
  # is clearer than the constant it folds to. Fixing that is worth doing, but not
  # at the price of a red badge on a repository whose tests all pass.
  lint:
    name: fmt + clippy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets
