[package]
name = "fast_segment"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
clap = { version = "4", features = ["derive"] }
png = "0.18.1"
rayon = "1.12.0"
smallvec = "1"
tiff = "0.11.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[dev-dependencies]
png = "0.18.1"
tiff = "0.11.3"
