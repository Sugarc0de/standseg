[package]
name = "standseg"
version = "0.2.1"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Multi-resolution forest stand segmentation from satellite imagery (Ye et al. 2025; Woodcock & Harward 1992)"
repository = "https://github.com/Sugarc0de/standseg"

[dependencies]
clap = { version = "4", features = ["derive"] }
png = "0.18.1"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
smallvec = "1"
# "zstd" is not on by default; cloud-optimized GeoTIFFs increasingly use it.
tiff = { version = "0.11.3", features = ["zstd"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[dev-dependencies]
png = "0.18.1"
tiff = { version = "0.11.3", features = ["zstd"] }
# The tiff encoder has no ZSTD writer, so the ZSTD reader test compresses its
# own strip. Same crate the decoder pulls in, so this adds nothing to the tree.
zstd = "0.13"
# Reading back what the GeoPackage writer produced, in the tests.
rusqlite = { version = "0.40", features = ["bundled"] }
